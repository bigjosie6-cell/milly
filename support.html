<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support | Trade With Milly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="support-page">
  <header class="simple-header">
    <a class="brand" href="index.html"><span class="brand-mark">M</span><span>Trade With Milly</span></a>
    <div class="simple-actions">
      <button class="theme-toggle" type="button" aria-label="Toggle light mode">
        <span class="toggle-track"><i class="toggle-thumb"></i></span>
        <strong>Dark</strong>
      </button>
      <a class="btn btn-secondary" href="index.html">Back Home</a>
    </div>
  </header>
  <main class="support-hero">
    <section class="support-card reveal visible">
      <p class="eyebrow">Customer support</p>
      <h1>Let Milly help you choose your next trading step.</h1>
      <p>Share your goals and preferred support channel. This page is designed for consultation booking, WhatsApp handoff, and client onboarding.</p>
      <div class="support-options">
        <a class="btn btn-primary magnetic" href="https://wa.me/2347077719341" data-whatsapp-link>Continue to WhatsApp</a>
        <a class="btn btn-secondary magnetic" href="mailto:support@tradewithmilly.com">Email Support</a>
      </div>
    </section>
    <section class="support-form support-card reveal visible">
      <h2>Request portfolio support</h2>
      <label>Name<input type="text" name="supportName" placeholder="Your full name"></label>
      <label>Email<input type="email" name="supportEmail" placeholder="you@example.com"></label>
      <label>Support Type<select name="supportType"><option>Portfolio management</option><option>Risk management</option><option>Trading signals</option><option>Beginner coaching</option></select></label>
      <label>Message<textarea name="supportMessage" placeholder="Tell Milly what you need help with"></textarea></label>
      <button class="btn btn-primary magnetic" type="button" data-support-request>Submit Support Request</button>
    </section>
  </main>
  <footer class="mini-socials">
    <a class="magnetic social-instagram" href="https://www.instagram.com/mcex.ng" aria-label="Instagram" data-social="instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="3.5"></circle><circle cx="17" cy="7" r="1"></circle></svg></a>
    <a class="magnetic social-x" href="social.html?platform=x" aria-label="X" data-social="x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></a>
    <a class="magnetic social-telegram" href="https://t.me/Bigmilly01" aria-label="Telegram" data-social="telegram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4L3 11.5l7 2.2L13 20l3-14-6 7"></path></svg></a>
  </footer>
  <script src="script.js?v=contact-links-2"></script>
</body>
</html>
